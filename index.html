<meta name="theme-color" content="#231E1A">
<script>/* Before anything shows: this device's Light/Dark and the church's colours, as last seen (js/app.js applyMode, applyTheme) */
(function () { try {
  var r = document.documentElement, t = JSON.parse(localStorage.getItem('church_hub_pref_theme') || 'null'), m = localStorage.getItem('church_hub_pref_mode') || '';
  r.setAttribute('data-mode', m === 'dark' || (!m && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  if (t && t.accent) { r.style.setProperty('--accent', t.accent); if (t.on) r.style.setProperty('--accent-on', t.on); r.style.setProperty('--side', t.side); r.style.setProperty('--side-2', t.side2);
    var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', t.side); }
} catch (e) { /* first visit or private window: Church Hub's own colours */ } })();</script>
