# Publishes the database security rules (firestore.rules) to the church's Firebase project, so nobody has to copy and
# paste them in the Firebase console (FIREBASE-SETUP.md step 7). Runs when a change to firestore.rules reaches main
# (a pull request is merged), and on demand (Actions → Publish database rules → Run workflow).
#
# The rules are tested first against Google's own Firestore emulator (tests/rules.test.mjs); they are only published
# if every test passes.
#
# Repository secret (Settings → Secrets and variables → Actions) – see docs/RULES-AUTOPUBLISH.md:
#   FIREBASE_RULES_KEY – the key of a Google Cloud service account that may only publish security rules
#                        (roles: Firebase Rules Admin, Service Account User, Service Usage Consumer).
# Without it the rules are still tested, and the log says they weren't published. The repository is public: the key
# is never printed, and is deleted from the runner straight after use.
name: Publish database rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/rules.test.mjs'
      - 'firebase.json'
      - '.github/workflows/publish-rules.yml'
  workflow_dispatch:

concurrency:
  group: publish-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Install test tools
        run: npm i --no-save firebase-tools@15 @firebase/rules-unit-testing@6 firebase@13

      - name: Test the rules (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-church-hub "node tests/rules.test.mjs"

      - name: Publish the rules to Firebase
        env:
          FIREBASE_RULES_KEY: ${{ secrets.FIREBASE_RULES_KEY }}
        run: |
          if [ -z "$FIREBASE_RULES_KEY" ]; then
            echo "::warning title=Rules not published::Add the FIREBASE_RULES_KEY secret (docs/RULES-AUTOPUBLISH.md), or publish them by hand (FIREBASE-SETUP.md step 7)."
            exit 0
          fi
          # The church's project, from js/firebase-config.js (the same one the website uses)
          PROJECT=$(node -e "global.window={};require('./js/firebase-config.js');process.stdout.write((window.CHURCH_HUB_FIREBASE||{}).projectId||'')")
          if [ -z "$PROJECT" ]; then echo "::error title=No Firebase project::js/firebase-config.js has no projectId."; exit 1; fi
          KEY="$RUNNER_TEMP/rules-key.json"
          printf '%s' "$FIREBASE_RULES_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$KEY" npx firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive
          echo "::notice title=Rules published::The database rules are live in Firebase project $PROJECT."
