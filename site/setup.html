<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up Church Hub for your church</title>
<meta name="description" content="A friendly, step-by-step guide that takes your church from nothing to a working Church Hub – and reminds you what's still possible.">
<!-- Read again whenever a feature is added (the middle version number goes up): see the top of site/setup-kit.js. -->
<meta name="reviewed-for" content="0.92">
<meta name="theme-color" content="#16212E">
<link rel="icon" href="../assets/icons/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* The setup tool. Same colours and letters as the website (site/index.html): evening blue, and the orange of the cross. */
:root {
  --ink: #16212E; --ink-2: #4A5563; --ink-3: #6B7480; --paper: #FFFFFF; --bg: #F7F6F2; --stone: #F0EFEA; --line: #E1E2DC;
  --orange: #E8590C; --orange-ink: #B8430A; --orange-soft: #FFEDE1; --leaf: #1F6B3A; --leaf-soft: #E1F2E6; --sun: #7A5300; --sun-soft: #FFF3D1;
  --display: 'Bricolage Grotesque', system-ui, sans-serif; --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 20px; --shadow: 0 1px 2px rgba(22,33,46,.05), 0 8px 28px -8px rgba(22,33,46,.12);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; color: var(--ink); background: var(--bg); }
a { color: var(--orange-ink); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; line-height: 1.08; margin: 0; font-weight: 800; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: -0.03em; }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }
.muted { color: var(--ink-2); }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(247,246,242,.88); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 800 1.15rem var(--display); letter-spacing: -0.02em; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex: none; }
.brand small { font: 600 .8rem var(--body); color: var(--ink-3); letter-spacing: 0; display: block; margin-top: -3px; }
.grow { flex: 1; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 8px); background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; min-width: 260px; z-index: 30; }
.menu .pop button, .menu .pop a { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px; border-radius: 10px; cursor: pointer; color: var(--ink); text-decoration: none; font-weight: 700; font-size: .98rem; }
.menu .pop button:hover, .menu .pop a:hover { background: var(--stone); }
.menu .pop .bad { color: #9B1C1C; }
.menu .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 1rem/1 var(--body); padding: 15px 24px; border-radius: 999px; text-decoration: none; border: 2px solid transparent; cursor: pointer; transition: background .15s, transform .12s, box-shadow .15s, opacity .15s; background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--orange); color: #fff; border-color: transparent; box-shadow: 0 6px 18px -8px rgba(232,89,12,.7); }
.btn.primary:hover { background: var(--orange-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.small { padding: 10px 16px; font-size: .92rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--stone); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--orange-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

main { padding: 36px 0 120px; min-height: 70vh; }
.card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid rgba(22,33,46,.04); }
.eyebrow { font-weight: 700; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-ink); }

/* Welcome */
.hello { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding: 26px 0 10px; }
.hello .lead { font-size: 1.22rem; color: var(--ink-2); margin-top: 18px; max-width: 46ch; }
.hello .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; align-items: center; }
.journey { padding: 26px; }
.journey ol { list-style: none; margin: 0; padding: 0; counter-reset: j; }
.journey li { display: flex; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line); counter-increment: j; }
.journey li:first-child { border-top: 0; padding-top: 0; }
.journey li::before { content: counter(j); width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--orange-soft); color: var(--orange-ink); display: grid; place-items: center; font-weight: 700; }
.journey li b { display: block; }
.journey li span { color: var(--ink-2); font-size: .95rem; }
.need { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; background: var(--stone); font-size: .9rem; font-weight: 700; color: var(--ink-2); }
.churches { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 26px; }
.church { padding: 22px; display: flex; gap: 18px; align-items: center; text-decoration: none; color: var(--ink); transition: transform .15s, box-shadow .15s; }
.church:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(22,33,46,.06), 0 16px 36px -12px rgba(22,33,46,.2); }
.church b { font-family: var(--display); font-size: 1.15rem; display: block; line-height: 1.2; }
.church small { color: var(--ink-2); }
@media (max-width: 860px) { .hello { grid-template-columns: 1fr; gap: 28px; } }

/* Form fields */
.field { display: block; margin-top: 18px; }
.field > span { display: block; font-weight: 700; margin-bottom: 7px; }
.field input, .field select, .field textarea { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-size: 1.05rem; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 4px var(--orange-soft); }
.field.req input, .field.req select, .field.req textarea { background: #FFFBF7; }
.field textarea { min-height: 150px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .88rem; }
.field .hint { color: var(--ink-3); font-size: .9rem; margin-top: 6px; }
.field .hint.ok { color: var(--leaf); font-weight: 700; }
.field .hint.bad { color: #9B1C1C; font-weight: 700; }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.idea { border: 1.5px dashed var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .9rem; font-weight: 700; color: var(--ink-2); }
.idea:hover { border-color: var(--orange); color: var(--orange-ink); }
.found { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
.found span { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 12px; font-size: .9rem; font-weight: 700; background: var(--stone); color: var(--ink-3); }
.found span.ok { background: var(--leaf-soft); color: var(--leaf); }
.place-pick { margin-top: 12px; }
.place-pick summary { cursor: pointer; color: var(--orange-ink); font-weight: 700; font-size: .95rem; }

/* The church's overview */
.over-head { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
.over-head .grow { min-width: 260px; }
.over-head .lead { color: var(--ink-2); margin-top: 8px; font-size: 1.1rem; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 800 1.9rem/1 var(--display); }
.ring .num small { display: block; font: 700 .78rem var(--body); color: var(--ink-3); margin-top: 4px; }
.ring circle { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.church .ring { width: 64px; height: 64px; }
.church .ring .num { font-size: 1rem; }
.next { margin-top: 30px; padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; background: var(--ink); color: #fff; border: 0; position: relative; overflow: hidden; }
.next::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(232,89,12,.45), transparent 70%); pointer-events: none; }
.next .eyebrow { color: #FFB68A; }
.next h2 { margin-top: 6px; }
.next p { color: #C9D1D9; margin-top: 8px; max-width: 58ch; }
.next .btn { position: relative; z-index: 1; }
.next.live { background: linear-gradient(135deg, #1F6B3A, #16212E); }
@media (max-width: 700px) { .next { grid-template-columns: 1fr; } }
.chapters { display: grid; gap: 14px; margin-top: 30px; }
.chapter { padding: 20px 22px; }
.chapter > header { display: flex; align-items: center; gap: 14px; }
.chapter > header .grow p { color: var(--ink-2); font-size: .95rem; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: .82rem; font-weight: 700; background: var(--stone); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--leaf-soft); color: var(--leaf); }
.badge.new { background: var(--orange); color: #fff; }
.badge.due { background: var(--sun-soft); color: var(--sun); }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; }
.steps a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; }
.steps a:hover { background: var(--stone); }
.steps a .m { margin-left: auto; color: var(--ink-3); font-weight: 400; font-size: .88rem; white-space: nowrap; }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; background: var(--paper); }
.tick.on { background: var(--leaf); border-color: var(--leaf); }
.tick.on::after { content: ''; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); }
.tick.here { border-color: var(--orange); box-shadow: 0 0 0 4px var(--orange-soft); }
.chapter.done > header .tick { width: 34px; height: 34px; }
.section-head { margin-top: 56px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.section-head .grow p { color: var(--ink-2); margin-top: 6px; max-width: 60ch; }
.seg { display: inline-flex; background: var(--stone); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: .92rem; color: var(--ink-2); cursor: pointer; }
@media (max-width: 600px) { .seg { display: flex; width: 100%; } .seg button { flex: 1; padding: 9px 6px; font-size: .84rem; } }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(22,33,46,.12); }
.grow-groups { margin-top: 18px; display: grid; gap: 26px; }
.grow-groups h3 { font-size: .85rem; font-family: var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 10px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.item { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.item .row { display: flex; gap: 10px; align-items: flex-start; }
.item .row b { font-family: var(--display); font-size: 1.08rem; font-weight: 600; line-height: 1.3; flex: 1; }
.item p { color: var(--ink-2); font-size: .96rem; }
.item .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; align-items: center; }
.item details summary { cursor: pointer; color: var(--orange-ink); font-weight: 700; font-size: .95rem; list-style: none; }
.item details summary::-webkit-details-marker { display: none; }
.item details[open] summary { margin-bottom: 4px; }
.item.done { background: #FBFCFA; }
.item.done .row b { color: var(--ink-2); }
.coming { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.coming div { padding: 18px; border-radius: var(--r); border: 2px dashed var(--line); }
.coming b { display: block; font-family: var(--display); font-weight: 600; }
.coming p { color: var(--ink-2); font-size: .94rem; margin-top: 4px; }
.empty { padding: 28px; text-align: center; color: var(--ink-2); }

/* One step */
.stepview { display: grid; grid-template-columns: 270px 1fr; gap: 34px; align-items: start; }
.rail { position: sticky; top: 86px; }
.rail .back { display: inline-flex; gap: 6px; font-weight: 700; text-decoration: none; margin-bottom: 14px; }
.rail h4 { margin: 18px 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.rail a.s { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-size: .93rem; font-weight: 700; line-height: 1.3; }
.rail a.s:hover { background: var(--stone); }
.rail a.s.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.rail .tick { width: 20px; height: 20px; }
.rail .tick.on::after { width: 8px; height: 4px; border-width: 0 0 2px 2px; }
.bar { display: none; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 6px 0 18px; }
.bar i { display: block; height: 100%; background: var(--orange); border-radius: inherit; transition: width .6s; }
.step { padding: 36px 40px 30px; }
.step h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-top: 10px; }
.step .why { font-size: 1.15rem; color: var(--ink-2); margin-top: 12px; max-width: 58ch; }
.step .meta { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.step .body { margin-top: 26px; }
.step .body > p { margin-bottom: 14px; }
.how { margin: 0; padding: 0; list-style: none; counter-reset: h; display: grid; gap: 4px; }
.how li { counter-increment: h; position: relative; padding: 12px 0 12px 48px; border-top: 1px solid var(--line); }
.how li:first-child { border-top: 0; }
.how li::before { content: counter(h); position: absolute; left: 0; top: 10px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.ui { background: var(--stone); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; padding: 1px 7px; font-weight: 700; white-space: nowrap; font-size: .95em; }
.copy { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid #F5C9AE; background: var(--orange-soft); color: var(--orange-ink); border-radius: 10px; padding: 3px 10px; font-weight: 700; cursor: pointer; font-size: .95em; vertical-align: baseline; word-break: break-all; text-align: left; transition: transform .1s; }
.copy:hover { border-color: var(--orange); }
.copy:active { transform: scale(.97); }
.copy.rules, .copy.file { padding: 10px 16px; border-radius: 999px; background: var(--orange); color: #fff; border-color: transparent; font-size: 1rem; }
.copy.done { background: var(--leaf-soft); color: var(--leaf); border-color: #B9DEC4; }
.open { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; font-size: .95em; white-space: nowrap; }
.open:hover { background: #2A3A4D; }
.note { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #EEF3F8; color: #23384F; font-size: .97rem; }
.warn { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--sun-soft); color: var(--sun); font-size: .97rem; }
.foot { display: flex; align-items: center; gap: 12px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.foot .grow { min-width: 10px; }
.qr { margin-top: 10px; }
.qr svg { width: 160px; height: 160px; border-radius: 12px; }
@media (max-width: 860px) {
  .stepview { grid-template-columns: 1fr; gap: 0; }
  .rail { position: static; }
  .rail nav { display: none; }
  .bar { display: block; }
  .step { padding: 26px 20px 22px; }
  .how li { padding-left: 42px; }
  .foot .btn.primary { flex: 1; }
}

/* Toast and celebration */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; z-index: 50; transition: transform .25s, opacity .25s; pointer-events: none; box-shadow: var(--shadow); }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.cheer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(22,33,46,.45); padding: 20px; animation: fade .25s; }
.cheer .card { max-width: 480px; padding: 34px; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.cheer .big { width: 76px; height: 76px; border-radius: 50%; background: var(--leaf); margin: 0 auto 18px; display: grid; place-items: center; }
.cheer p { color: var(--ink-2); margin: 10px 0 24px; }
.confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 45; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
footer { padding: 30px 0 50px; color: var(--ink-3); font-size: .9rem; border-top: 1px solid var(--line); }
footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <span class="mark"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v32M13 19h22" fill="none" stroke="#E8590C" stroke-width="6" stroke-linecap="round"/></svg></span>
      <span>Church Hub<small>Setting up a church</small></span>
    </a>
    <span class="grow"></span>
    <details class="menu" id="menu">
      <summary class="btn small">More</summary>
      <div class="pop">
        <a href="#/new">Set up another church</a>
        <button type="button" data-act="save">Save progress to a file</button>
        <button type="button" data-act="load">Open a progress file</button>
        <a href="index.html">About Church Hub</a>
        <a href="https://github.com/pian1966/church-hub/blob/main/docs/FIREBASE-SETUP.md" target="_blank" rel="noopener">The full written guide</a>
        <hr><button type="button" data-act="forget" class="bad" id="forget">Remove this church from this computer</button>
      </div>
    </details>
  </div>
</header>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
<footer><div class="wrap"><span>Everything you type here stays on this computer – nothing is sent to Church Hub. Never type passwords here.</span><span id="ver"></span></div></footer>
<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/version.js"></script>
<script src="../js/countries.js"></script>
<script src="../js/qr.js"></script>
<script src="setup-kit.js"></script>
<script>
(function () {
  'use strict';
  var K = SetupKit, esc = K.esc, view = document.getElementById('view');
  var KEY = 'church_hub_setup', VERSION = (window.ChurchHubVersion || {}).version || '0.0.0', NOW = VERSION.split('.').slice(0, 2).join('.');
  var rulesText = '', rulesAsked = false, seenThisVisit = {}, growTab = 'todo';
  document.getElementById('ver').textContent = 'Up to date with Church Hub ' + VERSION;

  /* ---------- saved progress (this browser only) ---------- */
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { churches: {} }; } catch (e) { return { churches: {} }; } }
  var db = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('This browser won’t keep your progress – use More → Save progress to a file.'); } }
  function church(id) { return db.churches[id]; }
  function list() { return Object.keys(db.churches).map(function (k) { return db.churches[k]; }).sort(function (a, b) { return (b.touched || '').localeCompare(a.touched || ''); }); }

    var h = function (k, cls, text) { var el = document.getElementById('hint-' + k); if (el) { el.className = 'field hint' + (cls ? ' ' + cls : ''); el.textContent = text; } };
    if (s.id === 'gmail') h('churchEmail', K.validEmail(ch.churchEmail) ? 'ok' : '', K.validEmail(ch.churchEmail) ? 'Looks good.' : 'Type it once you have made it.');
    if (s.id === 'github') { var ok = K.validGithub(ch.gh); h('gh', ch.gh ? (ok ? 'ok' : 'bad') : '', !ch.gh ? '' : ok ? 'Looks good.' : 'Letters, numbers and single hyphens only.'); }
    if (s.id === 'fb-admin') h('adminEmail', '', 'Usually the church’s Google account. If you will sign in with your own church email, type that instead.');
    if (s.id === 'fb-web') {
      var r = K.parseConfig(ch.cfgText), f = document.getElementById('found');
      if (f) f.innerHTML = ['apiKey', 'authDomain', 'projectId', 'appId'].map(function (k) { var got = r.missing.indexOf(k) < 0; return '<span class="' + (got ? 'ok' : '') + '">' + (got ? '✓ ' : '○ ') + k + '</span>'; }).join('');
      h('cfgText', !ch.cfgText ? '' : r.ok ? 'ok' : 'bad', !ch.cfgText ? '' : r.ok ? 'Found all four – this is the church’s database ' + r.cfg.projectId + '.' : 'Not all four lines found yet – copy everything Firebase shows, from the first line to the last.');
    }
  }
  function finish(ch, s) {
    var was = K.stepDone(ch, s.id), chapDoneBefore = K.stepsIn(s.chapter).every(function (x) { return K.stepDone(ch, x.id); });
    ch.done = ch.done || {}; if (!was) ch.done[s.id] = today();
    if (s.id === 'fb-admin' && !ch.adminEmail) ch.adminEmail = ch.churchEmail;
    touch(ch);
    var next = K.STEPS[K.STEPS.indexOf(s) + 1], p = K.progress(ch);
    var goTo = '#/c/' + ch.id + (next && !K.stepDone(ch, next.id) ? '/s/' + next.id : p.next ? '/s/' + p.next.id : '');
    var chapNow = K.stepsIn(s.chapter).every(function (x) { return K.stepDone(ch, x.id); });
    location.hash = goTo;
    if (!was && s.id === 'signin') cheer('Church Hub is live!', esc(ch.name) + ' now has its own Church Hub. A few more things before anyone else joins.', 'Keep going', goTo);
    else if (!was && !p.next) cheer('All set up!', esc(ch.name) + ' is ready for its people. Everything else Church Hub can do is waiting on the church’s list, whenever you’re ready.', 'See the list', '#/c/' + ch.id);
    else if (!was && chapNow && !chapDoneBefore) { confetti(); toast('“' + K.chapterOf(s.chapter).title + '” – done!'); }
  }

  /* ---------- clicks anywhere ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    var parts = location.hash.replace(/^#\/?/, '').split('/'), ch = parts[0] === 'c' ? church(parts[1]) : null;
    if (t.dataset.copy != null) return copyText(t.dataset.copy, t);
    if (t.dataset.rules) {
      if (rulesText) return copyText(rulesText, t);
      return fetch('../firestore.rules', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (x) { rulesText = x; copyText(x, t); }, function () { toast('Couldn’t fetch the rules – check the internet and try again'); });
    }
    if (t.dataset.file && ch) { var r = K.parseConfig(ch.cfgText); if (!r.ok) return toast('Do the step “Get the database’s address” first'); return copyText(K.configFile(r.cfg, ch.name), t); }
    if (t.dataset.fill && ch) { var inp = view.querySelector('[data-key="' + t.dataset.fill + '"]'); if (inp) { inp.value = t.dataset.v; inp.dispatchEvent(new Event('input')); inp.dispatchEvent(new Event('change')); inp.focus(); } return; }
    if (t.dataset.tab) { growTab = t.dataset.tab; var y = scrollY; route(); scrollTo(0, y); return; }
    if (t.dataset.grow && ch) {
      ch.grow = ch.grow || {};
      if (t.dataset.grow === 'undo') delete ch.grow[t.dataset.id];
      else ch.grow[t.dataset.id] = t.dataset.grow === 'skip' ? { skip: true, at: today() } : { at: today() };
      touch(ch); var y2 = scrollY; route(); scrollTo(0, y2);
      if (t.dataset.grow === 'done') toast('Ticked off');
      return;
    }
    var act = t.dataset.act;
    if (act === 'undone' && ch) { delete ch.done[parts[3]]; touch(ch); route(); return; }
    if (act === 'save') {
      var blob = new Blob([JSON.stringify({ churchHubSetup: 1, saved: new Date().toISOString(), churches: ch ? [ch] : list() }, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (ch ? K.slug(ch.name, 30) : 'churches') + '-church-hub-setup.json'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('Saved – open it on another computer to carry on there'); document.getElementById('menu').open = false; return;
    }
    if (act === 'load') { document.getElementById('file').click(); document.getElementById('menu').open = false; return; }
    if (act === 'forget' && ch) {
      if (!window.confirm('Remove ' + ch.name + '’s setup progress from this computer? Nothing in the church’s Church Hub, Google or GitHub accounts changes.')) return;
      delete db.churches[ch.id]; save(); location.hash = '#/'; return;
    }
  });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      var d = JSON.parse(txt); if (!d || !d.churchHubSetup || !Array.isArray(d.churches)) throw 0;
      d.churches.forEach(function (c) { if (c && c.id && c.name) db.churches[c.id] = c; });
      save(); toast('Opened'); location.hash = d.churches.length === 1 ? '#/c/' + d.churches[0].id : '#/'; route();
    }).catch(function () { toast('That isn’t a Church Hub setup file'); });
    e.target.value = '';
  });
  document.addEventListener('click', function (e) { var m = document.getElementById('menu'); if (m.open && !m.contains(e.target)) m.open = false; });
  window.addEventListener('hashchange', function () { route(); scrollTo(0, 0); document.getElementById('main').focus({ preventScroll: true }); });
  route();
})();
</script>
</body>
</html>
