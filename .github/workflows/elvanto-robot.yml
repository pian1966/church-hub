# Church Hub → Elvanto robot (see robot/robot.js; adapted from Leave Manager's robot).
# Every 15 minutes it checks Church Hub's Elvanto list (Leave → Elvanto) for approved, changed or cancelled leave,
# and if there is any, logs into Elvanto and updates the Unavailable Volunteers list.
#
# Repository secrets (Settings → Secrets and variables → Actions) – see docs/ELVANTO-ROBOT.md:
#   ROBOT_EMAIL, ROBOT_PASSWORD   – the robot's own Church Hub sign-in (created in Firebase → Authentication)
#   ELVANTO_USERNAME, ELVANTO_PASSWORD – an Elvanto login the robot can use (without two-step verification)
# This repository is public, so the robot never prints names or dates in its log.
name: Elvanto robot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = do waiting work · explore = describe Elvanto’s pages, change nothing'
        default: run
        type: choice
        options: [run, explore]

concurrency:
  group: elvanto-robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Anything to do?
        id: check
        env:
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
          MODE: check
        run: node robot/robot.js

      - name: Install the browser
        if: steps.check.outputs.jobs != '0' || github.event.inputs.mode == 'explore'
        working-directory: robot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Update Elvanto
        if: steps.check.outputs.jobs != '0' || github.event.inputs.mode == 'explore'
        env:
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
          ELVANTO_USERNAME: ${{ secrets.ELVANTO_USERNAME }}
          ELVANTO_PASSWORD: ${{ secrets.ELVANTO_PASSWORD }}
          ELV_LIST_PATH: ${{ vars.ELVANTO_LIST_PATH }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: node robot/robot.js
