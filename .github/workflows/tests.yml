# Runs Church & Trellis's tests on GitHub for every pull request, and on main after each merge: rostering rules, the database security rules
# (against Google's Firestore emulator) and the app in a browser as every role. Made-up people only.
# When a change only touches the public website (site/index.html) or the documentation (docs/, *.md), the tests are
# skipped: the check still runs and turns green in seconds, so "Protect main" lets the pull request merge.
# A branch is tested once its pull request is open (not on every push as well, which ran the same tests twice at once);
# main is tested again after each merge, in case two pull requests that passed on their own don't work together.
# The test browser and the database emulator are kept between runs (cached), so they aren't downloaded every time.
name: Tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pull-requests: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Only the website or the documentation changed?
        id: changes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          files=''
          if [ '${{ github.event_name }}' = pull_request ]; then
            files=$(gh api --paginate 'repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files' --jq '.[].filename') || files=''
          else
            # On a branch, compare it with main: only the branch's own changes count. Otherwise bringing main into the branch
            # ("Update branch") would count everything main gained since, and run every test for a website-only change.
            # On main itself (or a brand-new branch with no "before"), compare with what was there before the push.
            base='${{ github.event.before }}'
            if [ '${{ github.ref_name }}' != '${{ github.event.repository.default_branch }}' ]; then base='${{ github.event.repository.default_branch }}'; fi
            case "$base" in ''|0000000000000000000000000000000000000000) base='${{ github.event.repository.default_branch }}';; esac
            files=$(gh api "repos/${{ github.repository }}/compare/$base...${{ github.sha }}" --jq 'if (.files|length) >= 300 then empty else .files[].filename end') || files=''
          fi
          # Unknown (error, or more than 300 files) or anything outside site/index.html, docs/ and *.md -> run every test.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -vE '^(site/index\.html|docs/)|\.md$' > /dev/null; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Only the website or the documentation changed - the tests are skipped.'
          fi
      - if: steps.changes.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22 }
      - if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - if: steps.changes.outputs.skip != 'true'
        name: Rostering rules
        run: node tests/roster.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Leave Manager import
        run: node tests/leave-import.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Elvanto import
        run: node tests/elvanto-import.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Elvanto updates (leave → Unavailable Volunteers) and the robot
        run: node tests/elvanto-sync.test.js && node tests/robot.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Households and guardians
        run: node tests/households.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Version numbers (every file fetched again after an update)
        run: node tests/versions.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Generic brochure branding
        run: node tests/brochure.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Languages
        run: node tests/i18n.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Advanced people search
        run: node tests/people-search.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: People list search (names, contact details, addresses)
        run: node tests/directory-search.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Finding duplicates
        run: node tests/duplicates.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Countries (addresses, regions)
        run: node tests/countries.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Setup tool (covers every part of the app)
        run: node tests/setup-kit.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Church wording
        run: node tests/wording.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Privacy law by country
        run: node tests/privacy-law.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Services and special services
        run: node tests/serving.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Care groups
        run: node tests/care.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Messages
        run: node tests/messages.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Leadership groups, the Archive and the Library
        run: node tests/leaders.test.js && node tests/archive.test.js && node tests/library.test.js && node tests/richtext.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Home tips and what's new
        run: node tests/tips.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Subscription (coffee prices, payment holidays, the prayer circle)
        run: node tests/coffee.test.js && node tests/community.test.js && node tests/studies.test.js
      - if: steps.changes.outputs.skip != 'true'
        name: Keep the test browser and the database emulator between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: test-tools-playwright-1.64-firebase-15
      - if: steps.changes.outputs.skip != 'true'
        name: Install test tools
        run: npm i --no-save firebase-tools@15 @firebase/rules-unit-testing@6 firebase@13 playwright@1.64
      - if: steps.changes.outputs.skip != 'true'
        name: Database security rules (firestore.rules)
        run: npx firebase emulators:exec --only firestore --project demo-church-hub "node tests/rules.test.mjs"
      - if: steps.changes.outputs.skip != 'true'
        name: App in a browser, every role (demo and live)
        run: npx playwright install --with-deps chromium && node tests/app.test.js
